name: Package and release VSIX

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint TypeScript
        run: npm run lint
      - name: Check Python backend syntax
        run: python3 -m compileall -q backend
      - name: Create installable VSIX
        run: npm run package:vsix
      - name: Verify VSIX contents
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          from zipfile import ZipFile

          packages = glob.glob("adaassist-*.vsix")
          if len(packages) != 1:
              raise SystemExit(f"Expected one VSIX, found: {packages}")
          with ZipFile(packages[0]) as archive:
              files = set(archive.namelist())
              required = {
                  "extension/package.json",
                  "extension/out/extension.js",
                  "extension/backend/main.py",
                  "extension/backend/requirements.txt",
                  "extension/backend/src/session_service.py",
                  "extension/media/webview.js",
                  "extension/media/webview.css",
                  "extension/node_modules/markdown-it/dist/markdown-it.min.js",
                  "extension/node_modules/@highlightjs/cdn-assets/highlight.min.js",
              }
              missing = sorted(required - files)
              if missing:
                  raise SystemExit(f"VSIX is missing runtime assets: {missing}")
              package = json.loads(archive.read("extension/package.json"))
              print(f"Verified {package['name']} {package['version']}: {len(files)} assets")
          PY
          sha256sum adaassist-*.vsix > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adaassist-vsix
          path: |
            adaassist-*.vsix
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish verified VSIX to GitHub Releases
    needs: package
    # Ordinary pushes and PRs build artifacts only. An explicitly marked
    # release commit on main can publish without a separately pushed tag.
    # Traditional matching version-tag pushes continue to work.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[publish-vsix]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: adaassist-vsix
      - name: Resolve version and guard against duplicate releases
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must match package.json version ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; skipping publication."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]] &&
               git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists without a release. Inspect it before publishing."
              exit 1
            fi
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish VSIX and SHA-256 checksum
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AdaAssist ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            adaassist-*.vsix
            SHA256SUMS.txt
